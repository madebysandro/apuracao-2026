// ---------- motores de animação: JS (DOM/CSS) × Three.js ----------
let motor = null;
const PALETA = ['#009c3b', '#ffdf00', '#1e5bc6', '#ff5fa2', '#8e44ad', '#ffffff', '#ff7a00', '#00b7c3'];
function motorJs() {
  const fundo = document.getElementById('fundo');
  const EMOJI = ['🗳️', '✅', '⭐', '🎉', '✨', '🎊'];
  return {
    iniciar() {
      if (calmo) return;
      fundo.innerHTML = Array.from({ length: 22 }, (_, i) =>
        `<span style="--x:${Math.random() * 100}vw;--d:${14 + Math.random() * 16}s;--a:${-Math.random() * 30}s;--s:${0.7 + Math.random() * 1.3}">${EMOJI[i % EMOJI.length]}</span>`).join('');
    },
    parar() { fundo.innerHTML = ''; },
    explodir() {
      const chuva = document.createElement('div');
      chuva.className = 'chuva';
      chuva.innerHTML = Array.from({ length: 160 }, (_, i) => {
        const lado = i % 2 ? 1 : -1;
        return `<i style="left:${lado < 0 ? 0 : innerWidth}px;top:${innerHeight}px;--dx:${-lado * (80 + Math.random() * innerWidth * 0.45)}px;--dy:${-(innerHeight * (0.35 + Math.random() * 0.55))}px;--r:${Math.random() * 1080 - 540}deg;--c:${PALETA[i % PALETA.length]};--t:${1.8 + Math.random() * 1.2}s"></i>`;
      }).join('');
      document.body.append(chuva);
      setTimeout(() => chuva.remove(), 3200);
    },
  };
}

let tres = null;
async function motorThree() {
  if (tres) return tres;
  const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js');
  const canvas = document.createElement('canvas');
  canvas.id = 'palco3d';
  document.body.prepend(canvas);
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  const cena = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
  cam.position.z = 16;
  cena.add(new THREE.AmbientLight(0xffffff, 1.5));
  const sol = new THREE.DirectionalLight(0xffffff, 2.6);
  sol.position.set(4, 6, 10);
  cena.add(sol);

  // Cédula desenhada num canvas 2D e usada como textura.
  const tx = document.createElement('canvas');
  tx.width = 128; tx.height = 170;
  const g = tx.getContext('2d');
  g.fillStyle = '#fffdf4'; g.fillRect(0, 0, 128, 170);
  g.fillStyle = '#009c3b'; g.fillRect(0, 0, 128, 26);
  g.fillStyle = '#ffdf00'; g.fillRect(0, 26, 128, 6);
  g.strokeStyle = '#99a3b3'; g.lineWidth = 3;
  for (let y = 50; y < 160; y += 26) { g.strokeRect(12, y, 16, 16); g.beginPath(); g.moveTo(38, y + 8); g.lineTo(114, y + 8); g.stroke(); }
  g.strokeStyle = '#002776'; g.lineWidth = 5;
  g.beginPath(); g.moveTo(11, 75); g.lineTo(29, 93); g.moveTo(29, 75); g.lineTo(11, 93); g.stroke();
  const textura = new THREE.CanvasTexture(tx);
  textura.colorSpace = THREE.SRGBColorSpace;

  const dummy = new THREE.Object3D(), corT = new THREE.Color();
  function enxame(geo, mat, n, colorir) {
    const m = new THREE.InstancedMesh(geo, mat, n);
    m.frustumCulled = false;
    m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    const p = Array.from({ length: n }, () => ({ x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, rx: Math.random() * 6, ry: Math.random() * 6, sx: (Math.random() - .5) * 4, sy: (Math.random() - .5) * 4, vida: 0, fase: Math.random() * 6 }));
    if (colorir) p.forEach((_, i) => m.setColorAt(i, corT.set(PALETA[i % PALETA.length])));
    cena.add(m);
    return { m, p };
  }
  const lado2 = { side: THREE.DoubleSide };
  const confete = enxame(new THREE.PlaneGeometry(0.28, 0.16), new THREE.MeshLambertMaterial(lado2), calmo ? 0 : 150, true);
  const cedulas = enxame(new THREE.PlaneGeometry(0.75, 1.0), new THREE.MeshLambertMaterial({ ...lado2, map: textura }), calmo ? 0 : 26, false);
  const estouro = enxame(new THREE.PlaneGeometry(0.3, 0.17), new THREE.MeshLambertMaterial(lado2), 700, true);

  let W = 10, H = 10;
  function medir() {
    renderer.setSize(innerWidth, innerHeight, false);
    cam.aspect = innerWidth / innerHeight;
    cam.updateProjectionMatrix();
    H = 2 * Math.tan(THREE.MathUtils.degToRad(cam.fov / 2)) * cam.position.z;
    W = H * cam.aspect;
  }
  medir();
  addEventListener('resize', medir);
  for (const q of [...confete.p, ...cedulas.p]) {
    q.x = (Math.random() - .5) * W * 1.1; q.y = (Math.random() - .5) * H * 1.2; q.z = (Math.random() - .5) * 8;
    q.vy = -(0.4 + Math.random() * 0.9);
  }
  for (const q of cedulas.p) q.vy *= 0.6;

  let rodando = false, ultimo = 0, t = 0;
  function pousar(m, i, q, escala) {
    dummy.position.set(q.x, q.y, q.z);
    dummy.rotation.set(q.rx, q.ry, 0);
    dummy.scale.setScalar(escala);
    dummy.updateMatrix();
    m.setMatrixAt(i, dummy.matrix);
  }
  function passo(agora) {
    if (!rodando) return;
    const dt = Math.min(0.05, (agora - ultimo) / 1000);
    ultimo = agora; t += dt;
    for (const { m, p } of [confete, cedulas]) {
      p.forEach((q, i) => {
        q.y += q.vy * dt; q.x += Math.sin(t * 0.8 + q.fase) * 0.4 * dt;
        q.rx += q.sx * dt; q.ry += q.sy * dt;
        if (q.y < -H / 2 - 1) { q.y = H / 2 + 1; q.x = (Math.random() - .5) * W * 1.1; }
        pousar(m, i, q, 1);
      });
      m.instanceMatrix.needsUpdate = true;
    }
    const arrasto = Math.pow(0.45, dt);
    estouro.p.forEach((q, i) => {
      if (q.vida > 0) {
        q.vida -= dt; q.vy -= 9 * dt;
        q.vx *= arrasto; q.vy *= arrasto; q.vz *= arrasto;
        q.x += q.vx * dt; q.y += q.vy * dt; q.z += q.vz * dt;
        q.rx += q.sx * dt * 3; q.ry += q.sy * dt * 3;
      }
      pousar(estouro.m, i, q, q.vida > 0 ? Math.min(1, q.vida) : 0);
    });
    estouro.m.instanceMatrix.needsUpdate = true;
    renderer.render(cena, cam);
    requestAnimationFrame(passo);
  }

  tres = {
    iniciar() {
      canvas.hidden = false;
      if (!rodando) { rodando = true; ultimo = performance.now(); requestAnimationFrame(passo); }
    },
    parar() { rodando = false; canvas.hidden = true; },
    explodir() {
      canvas.classList.add('festa');
      clearTimeout(tres.t);
      tres.t = setTimeout(() => canvas.classList.remove('festa'), 4200);
      estouro.p.forEach((q, i) => {
        const lado = i % 2 ? 1 : -1; // dois canhões, um em cada canto de baixo
        const ang = Math.PI / 2 + lado * (0.15 + Math.random() * 0.55);
        const v = 9 + Math.random() * 7;
        Object.assign(q, { x: lado * W * 0.48, y: -H * 0.5, z: (Math.random() - .5) * 4, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v, vz: (Math.random() - .5) * 5, vida: 2.4 + Math.random() * 1.6 });
      });
    },
  };
  return tres;
}
async function trocarFx(novo) {
  fx = novo;
  motor?.parar();
  motor = fx === 'three' ? await motorThree().catch(e => { console.warn('Three.js indisponível, usando JS', e); fx = 'js'; return motorJs(); }) : motorJs();
  motor.iniciar();
  barra();
}

// ---------- barra do protótipo ----------
const proto = document.getElementById('proto');
proto.hidden = !(/^(localhost|127\.|10\.|192\.168\.)/.test(location.hostname) || params.has('proto'));
function barra() {
  document.getElementById('proto-nome').textContent = `${variante} — ${VARIANTES[variante][0]}`;
  document.getElementById('proto-rosto').textContent = `Rosto ${rosto} — ${ROSTOS[rosto]}`;
  proto.querySelectorAll('.proto-rosto').forEach(el => { el.hidden = variante !== 'D'; });
  proto.querySelectorAll('[data-fx]').forEach(b => b.classList.toggle('on', b.dataset.fx === fx));
  const u = new URL(location.href);
  u.searchParams.set('variant', variante);
  u.searchParams.set('fx', fx);
  if (variante === 'D') { u.searchParams.set('tela', tela); u.searchParams.set('rosto', rosto); } else { u.searchParams.delete('tela'); u.searchParams.delete('rosto'); }
  history.replaceState(null, '', u);
}
function trocarVariante(passo) {
  const chaves = Object.keys(VARIANTES);
  variante = chaves[(chaves.indexOf(variante) + passo + chaves.length) % chaves.length];
  memoria.clear(); // ao trocar, tudo anima do zero
  desenhar('entrada');
  barra();
}
function trocarRosto(passo) {
  const chaves = Object.keys(ROSTOS);
  rosto = chaves[(chaves.indexOf(rosto) + passo + chaves.length) % chaves.length];
  memoria.clear();
  desenhar('entrada');
  barra();
}
proto.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.ir) trocarVariante(+b.dataset.ir);
  if (b.dataset.fx) trocarFx(b.dataset.fx);
  if (b.id === 'simular') simular();
  if (b.dataset.rostoIr) trocarRosto(+b.dataset.rostoIr);
});
addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') variante === 'D' ? trocarRosto(-1) : trocarVariante(-1);
  if (e.key === 'ArrowRight') variante === 'D' ? trocarRosto(1) : trocarVariante(1);
  if (e.key === '1' || e.key === '2') trocarTela(+e.key);
});
// Simula um lote novo do TSE (só no navegador); o próximo ciclo real restaura os números verdadeiros.
function simular() {
  if (!dados?.cargos?.presidente) return;
  const anterior = dados, novo = structuredClone(dados);
  for (const c of Object.values(novo.cargos)) {
    const soma = c.candidatos.reduce((s, x) => s + x.votos, 0);
    const fatia = c.candidatos.reduce((s, x) => s + x.pct, 0) / 100 || 1;
    const outros = soma / fatia - soma;
    c.candidatos.forEach(x => x.votos = Math.round(x.votos * (1.02 + Math.random() * 0.25)));
    const total = c.candidatos.reduce((s, x) => s + x.votos, 0) + outros * 1.1;
    c.candidatos.forEach(x => x.pct = x.votos / total * 100);
    c.candidatos.sort((a, b) => b.votos - a.votos);
    const ap0 = c.apurado;
    c.apurado = Math.min(100, c.apurado + 2 + Math.random() * 5);
    c.hora = new Date().toLocaleTimeString('pt-BR') + ' (simulado)';
    c.totais.validos = Math.round(total);
    c.totais.eleitoradoApurado = Math.round(c.totais.eleitoradoApurado * c.apurado / ap0);
    if (c.agremiacoes) simularCadeiras(c);
  }
  simulando = true;
  dados = novo;
  hist.push({ t: Date.now(), sim: true, c: Object.fromEntries(Object.entries(novo.cargos).map(([id, x]) => [id, {
    ap: x.apurado, hora: x.hora, vv: x.totais.validos, comp: x.totais.comparecimento, bra: x.totais.brancos, nul: x.totais.nulos,
    c: Object.fromEntries(x.candidatos.map(k => [k.n, [k.votos, k.pct, k.pos]])),
    ...(x.agremiacoes && { a: Object.fromEntries(x.agremiacoes.map(a => [a.sigla, [a.votos, a.vagas]])) }),
  }])) });
  desenhar();
  festa(anterior, novo);
}
// Na simulação, recalcula votos por agremiação, às vezes passa uma cadeira (pra ver a transição) e refaz quem é projetado.
function simularCadeiras(c) {
  for (const a of c.agremiacoes) a.votos = a.legenda + c.candidatos.filter(x => x.agr === a.sigla).reduce((s, x) => s + x.votos, 0);
  if (Math.random() < 0.6) {
    const com = c.agremiacoes.filter(a => a.vagas > 0);
    const perde = com.reduce((p, q) => q.votos / q.vagas < p.votos / p.vagas ? q : p);
    const ganha = c.agremiacoes.filter(a => a !== perde).reduce((p, q) => q.votos / (q.vagas + 1) > p.votos / (p.vagas + 1) ? q : p);
    perde.vagas--; ganha.vagas++;
  }
  c.agremiacoes.sort((p, q) => q.vagas - p.vagas || q.votos - p.votos);
  c.candidatos.forEach((x, i) => { x.pos = i + 1; x.projetado = false; });
  for (const a of c.agremiacoes) c.candidatos.filter(x => x.agr === a.sigla && x.valido).slice(0, a.vagas).forEach(x => { x.projetado = true; });
}

setInterval(tique, 1000);
setInterval(puxar, 5000);
barra();
desenhar('entrada');
puxar();
trocarFx(fx);
